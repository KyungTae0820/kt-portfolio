<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Frogger | KT Portfolio</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f0f12; color: #fff; overflow: hidden;
               font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
  #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  /* SDL keeps a CSS size set by the page and rescales mouse input, so the canvas can scale freely.
     No border or padding on the canvas: SDL maps mouse coordinates from its CSS box. */
  #canvas { display: block; border: 0; padding: 0; margin: 0; outline: none; background: #000;
            aspect-ratio: 448 / 512;
            width: min(100vw, calc(100vh * 448 / 512)); height: auto;
            image-rendering: pixelated; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px;
             align-items: center; justify-content: center; text-align: center; padding: 24px;
             background: rgba(15, 15, 18, .94); }
  #overlay[hidden] { display: none; }
  h1 { margin: 0; font-size: 24px; color: #FFCC00; }
  #status { color: rgba(255, 255, 255, .7); font-size: 14px; min-height: 1.2em; }
  #bar { width: min(360px, 80vw); height: 6px; border-radius: 999px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #FFCC00; transition: width .2s; }
  #bar.indeterminate > div { width: 30%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  #play { background: #FFCC00; color: #990000; border: 0; border-radius: 999px; padding: 12px 32px;
          font: inherit; font-size: 16px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
  #play:hover { background: #FFB600; }
  #play[hidden] { display: none; }
  .hint { color: rgba(255, 255, 255, .55); font-size: 12px; max-width: 420px; line-height: 1.6; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" width="448" height="512" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="overlay">
    <h1>Frogger</h1>
    <div id="status">Downloading…</div>
    <div id="bar" class="indeterminate"><div></div></div>
    <button id="play" type="button" hidden>PLAY</button>
    <div class="hint">Click the game to focus it, then use the keyboard.<br>Sound starts after your first click.</div>
  </div>
</div>
<script>
  var BUILD = '202609250110';
  var AUTOPLAY = /[?&]autoplay=1/.test(location.search);
  var canvas = document.getElementById('canvas');
  var overlay = document.getElementById('overlay');
  var statusEl = document.getElementById('status');
  var bar = document.getElementById('bar');
  var fill = bar.firstElementChild;
  var playBtn = document.getElementById('play');
  var started = false;

  function fail(msg) {
    overlay.hidden = false; playBtn.hidden = true; bar.hidden = true;
    statusEl.textContent = msg;
  }

  function start() {
    if (started) return;
    started = true;
    overlay.hidden = true;
    canvas.focus();
    try { Module.callMain([]); } catch (e) { if (e !== 'unwind' && !(e && e.name === 'ExitStatus')) fail('Error: ' + e); }
  }

  var Module = {
    canvas: canvas,
    // Wait for a click before running main(): the click unlocks audio and focuses this frame.
    noInitialRun: true,
    // .wasm resolves next to the .js, .data next to this page; both live in this folder.
    locateFile: function (path, prefix) { return prefix + path + '?v=' + BUILD; },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (text) {
      if (!text || started) return;
      var m = text.match(/([^(]+)\((\d+(?:\.\d+)?)\/(\d+)\)/);
      if (m) {
        bar.classList.remove('indeterminate');
        fill.style.width = Math.min(100, (100 * m[2]) / m[3]).toFixed(1) + '%';
        statusEl.textContent = m[1].trim() + ' ' + Math.round(m[2] / 1048576) + ' / ' + Math.round(m[3] / 1048576) + ' MB';
      } else if (!/^Running/.test(text)) {
        statusEl.textContent = text;
      }
    },
    onRuntimeInitialized: function () {
      if (AUTOPLAY) { start(); return; }
      bar.hidden = true;
      statusEl.textContent = 'Ready';
      playBtn.hidden = false;
      playBtn.focus();
    },
    onAbort: function (what) { fail('The game stopped (' + what + '). Reload the page to try again.'); }
  };

  playBtn.addEventListener('click', start);
  canvas.addEventListener('mousedown', function () { canvas.focus(); });
  window.addEventListener('focus', function () { if (started) canvas.focus(); });
  canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); fail('The graphics context was lost. Reload the page.'); });
  window.addEventListener('error', function (e) { if (!started || !overlay.hidden) fail('Error: ' + e.message); });
</script>
<script async src="Lab03.js?v=202609250110"></script>
</body>
</html>
